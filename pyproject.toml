[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "generative_inverse_wing_design"

[project]
name = "aeroelastic-cvae"
version = "0.1.0"
description = "Aeroelastic wing data generation and conditional VAE training."
authors = [{ name = "EDAC" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11.2"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "AeroSandbox==4.2.9",
  "hydra-core",
  "lightning",
  "matplotlib",
  "mlflow<=3.4.0",
  "numpy",
  "pandas",
  "psutil",
  "pyvista",
  "scikit-learn",
  "scipy",
  "sectionproperties",
  "shapely",
  "torch",
  "tqdm",
]

[project.optional-dependencies]
notebook = [
  "datasets",
  "huggingface-hub",
  "ipykernel",
  "jupyterlab",
  "minisom",
  "requests",
  "seaborn",
]

dev = [
  "black",
  "isort",
  "mypy",
  "pre-commit",
  "pytest",
  "ruff",
]

[tool.black]
line-length = 99

[tool.isort]
profile = "black"
known_first_party = ["generative_inverse_wing_design"]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"

